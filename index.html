    <script>
      /* mobile: no pinch / double-tap zoom */
      (function () {
        var touch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;

        if (!touch) return;
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
        document.addEventListener("touchmove", function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
      })();
    </script>

    <script>

    <script>
      /* WebGL context loss recovery — iOS sometimes silently drops the context.
         When that happens, reload the page (save data lives in localStorage, nothing lost). */
      (function () {
        var canvas = document.getElementById("canvas");
        if (!canvas) return;
        canvas.addEventListener("webglcontextlost", function (e) {
          e.preventDefault();
          setTimeout(function () { location.reload(); }, 300);
        }, false);
      })();
    </script>
    <script>
      window.onload = function () {
        var started = false, body = document.body;
        function start() { if (started) return; started = true; GameMaker_Init(); if (touch) tip(); }
        var touch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
        /* iOS: tap to start if WebGL context isn't ready yet */
        var canvas = document.getElementById("canvas");
        var gl = null;
        try { gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl"); } catch(e) {}
        if (!gl) {
          /* WebGL not ready — show tap-to-start overlay, start on first touch */
          var tap = document.createElement("div");
          tap.style.cssText = "position:fixed;inset:0;z-index:9999999;background:#2c68ff;display:flex;align-items:center;justify-content:center;font-family:'Silkscreen','Courier New',monospace;color:#fff;font-size:7vmin;text-shadow:3px 3px 0 #0b1f6b;cursor:pointer;";
          tap.textContent = "TAP TO PLAY";
          document.body.appendChild(tap);
          function onTap() { tap.remove(); start(); }
          tap.addEventListener("click", onTap);
          tap.addEventListener("touchend", function(e){ e.preventDefault(); onTap(); });
        } else {
          start();
        }
        function tip() {
          var standalone = matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone === true;
          if (standalone) return;
          try { if (localStorage.getItem("rb.homeTip")) return; } catch (e) {}
          var ua = navigator.userAgent, text = document.getElementById("rbIosText");
          if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1))
            text.textContent = 'For full screen: tap Share, then "Add to Home Screen", and play from the icon.';
          else if (/Android/.test(ua))
            text.textContent = 'For full screen: tap the \u22EE menu, then "Add to Home screen" (or "Install app"), and play from the icon.';
          var box = document.getElementById("rbIos");
          var close = function () { box.classList.remove("on"); try { localStorage.setItem("rb.homeTip", "1"); } catch (e) {} };
          box.querySelector("button").addEventListener("click", close);
          box.classList.add("on"); setTimeout(close, 12000);
        }
      };
